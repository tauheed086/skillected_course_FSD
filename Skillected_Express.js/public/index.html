<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    form {
      max-width: 350px;
      margin: 0 auto;
      padding: 24px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fafafa;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    form div {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
    }
    label {
      font-weight: 500;
      margin-bottom: 6px;
    }
    input[type="text"] {
      padding: 8px;
      border: 1px solid #bbb;
      border-radius: 4px;
      font-size: 1rem;
    }
    button[type="submit"] {
      padding: 10px 18px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button[type="submit"]:hover {
      background: #0056b3;
    }
  </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Welcome to Create Page</h1>
  <div>
    <form action="/userdata" method="POST">
      <div>
        <label for="Name">Name</label>
        <input type="text" placeholder="Enter Name" id="Name" name="Name">
      </div>
      <div>
        <label for="Email">E-mail</label>
        <input type="text" placeholder="Enter E-mail" id="Email" name="Email">
      </div>
      <div>
        <button type="submit">Submit</button>
      </div>
    </form>
  </div>
</body>
</html>
