<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>event on click</title>
</head>
<body>
  <center><button onclick="myfunction()"> click me to show text in console</button></center>
</body>
</html>

<script>
  var count = 0;
  function myfunction(){
    <!-- console.log("you clicked") -->
    alert("you clicked on me!")
    count++;
    alert(count)
  }
</script>
