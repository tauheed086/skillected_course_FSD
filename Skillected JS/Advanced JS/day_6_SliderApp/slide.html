<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider</title>
</head>
<body>
    <button>
        <a href="slider.html">Home Page</a>
    </button>
    <h1>Slider Page</h1>

    <button onclick="start()">slide start</button>
    <button onclick="stop()">slide stop</button>
    <div id="images"></div>


    
</body>
</html>

<script>

let imageDiv = document.getElementById("images");
let i = 0
let id
function start(){
    let image_arr = JSON.parse(localStorage.getItem("image1"));
    let img = document.createElement("img");
    id=setInterval(function(){
        if( i == image_arr.length){
            i = 0;
        }
        imageDiv.innerHTML = null;
        img.src = image_arr[i];
        imageDiv.append(img);
        i++;
    }, 1000);
    
}

function stop(){
    clearInterval(id);
}

</script>
