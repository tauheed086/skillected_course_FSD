<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Investors Details</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    #container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .card {
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      background: #fff;
    }

    .investors-img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
    }

    .company-logo {
      width: 60px;
      height: auto;
      margin-top: 10px;
    }

    .investors-name {
      font-size: 1.1em;
      font-weight: bold;
      margin: 10px 0 5px;
    }

    .designation {
      font-size: 0.95em;
      color: #555;
    }

    @media (max-width: 768px) {
      #container {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      #container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<h2>Investors Directory</h2>
<div id="container"></div>

<script src="task.js"></script>
</body>
</html>
