<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>home page</title>
</head>

<style>
    body{
        font-family: Arial,sans-serif;
        padding: 20px;
    }
    h1{
        text-align: center;
        color: cadetblue;
    }

    .grid{
        display: grid;
        grid-template-columns: repeat(4,1fr);
        gap: 20px;
    }

    .card{
        border: 1px solid rgb(112, 112, 209);
        padding: 10px;
        text-align: center;
        border-radius: 10px;
        box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
    }

    .title{
        font-weight: bold;
    }
    .brand,.price{
        margin: 5px 0;
        color: rgb(174, 113, 69);
    }




</style>
<body>
    <h1>Product_page</h1>
    <input type="text" id="searchBox" placeholder="Search by brand">

    <div id="productGrid" class="grid"></div>
    
</body>
</html>

<script>
    let allProducts =[];
    async function loadProducts(){
        try{
            const res = await fetch("https://dummyjson.com/products?limit=100");
            const data = await res.json();
            allProducts = data.products;

            console.log("loaded products",allProducts);
            displayProducts(allProducts);

        }catch(error){
            console.log("Error loading products",error)

        }
    }

    function displayProducts(products){
        const grid = document.getElementById("productGrid");


        if(products.length ===0){
            grid.innerHTML =`<div class ="no-result">No product found</div>`;
            return;
        }


        products.forEach(product=>{
            const card = document.createElement("div");
            card.className = "card"
            card.innerHTML=
            `
            <img src="${product.thumbnail}"/>
            <div class ="title">${product.title}</div>
             <div class ="brand">Brand:${product.brand}</div>
             <div class ="price">Price:${product.price}</div>

            `;
            grid.appendChild(card)



        });


    }


    //search function

    const searchBox = document.getElementById("searchBox")





    loadProducts();




</script>
