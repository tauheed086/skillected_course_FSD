<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change</title>
</head>
<body>
  <h1 id="h">Hi here</h1>
  <h1 class="tau">tau</h1>
  <p id="p">How are you</p>
  <h2 id="h2">everthings great?</h2>
</body>
</html>
<script>
  document.getElementsByTagName("h1")[0].innerText = "Hi Om";
  document.getElementsByTagName("p")[0].innerText = "I am great";
  document.getElementsByTagName("h2")[0].innerText = "Yes";
  document.getElementsByClassName("tau")[0].innerText="Tauheed"
</script>
